    <script>
      // Shim to ensure window.fetch has a setter when environment/extensions attempt to intercept it
      (function() {
        try {
          var origFetch = window.fetch;
          var currentFetch = origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var proto = Object.getPrototypeOf(window);
            if (proto && Object.getOwnPropertyDescriptor(proto, 'fetch')) {
              var pFetch = proto.fetch;
              Object.defineProperty(proto, 'fetch', {
                get: function() { return pFetch; },
                set: function(val) { pFetch = val; },
                configurable: true,
                enumerable: true
              });
            }
          } catch (err) {}
        }
      })();
    </script>
